<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">

<title>Ascension — V1.4</title>
<style>
:root{--bg:#07101f;--panel:#0e1a2c;--panel2:#13243a;--text:#f5f7fb;--muted:#a8b4c7;--accent:#8b7cff;--accent2:#5eead4;--danger:#fb7185;--line:#22324a;--shadow:0 20px 50px rgba(0,0,0,.25)}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#07101f,#0a1424 55%,#07101f);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:90px}.top{padding:28px 20px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800;letter-spacing:.2px}.brand span{color:var(--accent)}.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 10px}.screen{padding:10px 18px}.hero{padding:24px 4px 10px}.eyebrow{color:var(--accent2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}.hero h1{font-size:34px;line-height:1.05;margin:9px 0 12px}.hero p{color:var(--muted);line-height:1.55;margin:0}.card{background:rgba(14,26,44,.88);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 8px}.muted{color:var(--muted)}.big{font-size:42px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:16px;padding:14px 16px;background:var(--panel2);color:var(--text);font-weight:700}.btn.primary{background:linear-gradient(135deg,#8b7cff,#6f64e8)}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.danger{background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);color:#fecdd3}.btn:active{transform:scale(.98)}.wide{width:100%}.choice{display:block;width:100%;text-align:left;margin:9px 0}.choice.selected{outline:2px solid var(--accent);background:rgba(139,124,255,.15)}.range{width:100%;accent-color:var(--accent)}.intensity{display:flex;justify-content:space-between;align-items:center}.intensity strong{font-size:34px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:rgba(7,16,31,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:10}.nav button{background:none;border:0;color:var(--muted);font-size:11px;padding:7px 2px}.nav button.active{color:var(--text)}.nav .ico{display:block;font-size:20px;margin-bottom:3px}.list{display:flex;flex-direction:column;gap:9px}.item{padding:13px;border:1px solid var(--line);border-radius:15px;background:rgba(19,36,58,.55)}.item b{display:block;margin-bottom:4px}.tag{display:inline-block;font-size:11px;border-radius:999px;padding:4px 7px;background:rgba(94,234,212,.1);color:var(--accent2);margin:3px 3px 0 0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:min(480px,100%);margin:auto 0 0;background:#0b1728;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px;max-height:92vh;overflow:auto}.sheet h2{margin-top:0}.input{width:100%;background:#091426;border:1px solid var(--line);border-radius:14px;color:var(--text);padding:13px;outline:none}.textarea{min-height:100px;resize:vertical}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#f5f7fb;color:#07101f;padding:11px 14px;border-radius:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.bar{height:8px;background:#1a2940;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#8b7cff,#5eead4);border-radius:99px}.onboard{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px}.logo{width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,#8b7cff,#5eead4);display:grid;place-items:center;font-size:36px;font-weight:900;color:#07101f;margin-bottom:25px}.onboard h1{font-size:42px;margin:0 0 10px}.onboard p{color:var(--muted);line-height:1.6}.small{font-size:12px;line-height:1.5}.success{color:#5eead4}.empty{padding:25px 8px;text-align:center;color:var(--muted)}

/* V1.2 — Comprendre interactif */
.lesson{background:linear-gradient(145deg,rgba(19,36,58,.95),rgba(14,26,44,.95));border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}
.lesson h3{margin:0 0 7px}.tapgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tapcard{border:1px solid var(--line);border-radius:18px;padding:15px;background:#101f33;color:var(--text);text-align:left}
.tapcard:active{transform:scale(.98)}.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(139,124,255,.0)}50%{box-shadow:0 0 0 8px rgba(139,124,255,.08)}}
.meter{display:flex;gap:5px;margin:12px 0}.meter i{height:9px;flex:1;background:#1a2940;border-radius:9px}.meter i.on{background:linear-gradient(90deg,#8b7cff,#5eead4)}
.choice2{width:100%;text-align:left;margin:8px 0;border:1px solid var(--line);border-radius:16px;padding:13px;background:#101f33;color:var(--text)}
.choice2.correct{border-color:#5eead4;background:rgba(94,234,212,.10)}.choice2.wrong{border-color:#fb7185;background:rgba(251,113,133,.10)}
.fade{animation:fade .28s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.counter{font-size:30px;font-weight:800}.counterGrid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.counterStat{background:#101f33;border:1px solid var(--line);border-radius:16px;padding:12px}.triggerGrid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}.triggerBtn{border:1px solid var(--line);border-radius:14px;padding:11px 9px;background:#101f33;color:var(--text);text-align:left;transition:.15s}.triggerBtn.selected{border-color:var(--accent);background:rgba(139,124,255,.22);outline:2px solid var(--accent);font-weight:800}
</style></head>
<body>
<div id="singleFileInfo" style="margin:14px 0;padding:12px 14px;border-radius:14px;background:rgba(139,124,255,.10);font-size:13px;line-height:1.45;color:inherit;">
  <strong>Ascension V1.4 — test iPhone/Mac</strong><br>
  Cette version est autonome pour le premier test. Les données restent dans le stockage local de Safari.
</div>

<div id="root"></div>
<div id="toast" class="toast"></div>
<div id="supportModal" class="modal"></div>
<script>
const KEY='ascension_v1';
const defaults={started:false,goal:'',mode:'Reprise de contrôle',name:'',entries:[],trusted:'',notifications:false,startDate:'',cigarettesPerDay:'',packPrice:'',packSize:20,why:''};
let storedState=null;
try{storedState=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){storedState=null}
let state={...defaults,...(storedState||{})};
if(!Array.isArray(state.entries))state.entries=[];
if(typeof state.goal!=='string')state.goal='';
if(typeof state.mode!=='string')state.mode=defaults.mode;
if(typeof state.name!=='string')state.name='';
if(typeof state.trusted!=='string')state.trusted='';
if(typeof state.startDate!=='string')state.startDate='';
if(typeof state.cigarettesPerDay!=='string')state.cigarettesPerDay='';
if(typeof state.packPrice!=='string')state.packPrice='';
if(!Number(state.packSize))state.packSize=20;
state.entries.forEach(e=>{if(!Array.isArray(e.triggers))e.triggers=e.trigger?[e.trigger]:[]});
let screen='home';
let supportTriggers=[]; let journalTriggers=[]; let supportIntensity=6;
const TRIGGERS=['Stress','Fatigue','Ennui','Solitude','Habitude','Anxiété','Tristesse','Colère','Situation sociale / soirée','Conflit','Environnement / lieu','Une personne','Pensée / souvenir','Manque / craving','Envie de plaisir','Autre'];
function elapsedDays(){if(!state.startDate)return 0;const d=new Date(state.startDate+'T00:00:00');if(isNaN(d))return 0;const n=new Date();const t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return Math.max(0,Math.floor((t-d)/86400000))}
function tobaccoStats(){const d=elapsedDays(),c=Number(state.cigarettesPerDay),p=Number(state.packPrice),z=Number(state.packSize)||20;if(!c||!p)return null;const cigarettes=Math.floor(d*c);return {cigarettes,saved:(cigarettes/z)*p}}
function triggerTags(a){return (Array.isArray(a)?a:(a?[a]:[])).filter(Boolean).map(t=>'<span class="tag">'+esc(t)+'</span>').join('')}
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function save(){try{localStorage.setItem(KEY,JSON.stringify(state));return true}catch(e){toast('Impossible d’enregistrer sur cet appareil');return false}}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function daysTracked(){if(!state.entries.length)return 0;const ds=[...new Set(state.entries.map(e=>e.date.slice(0,10)))];return ds.length}
function render(){document.getElementById('root').innerHTML=state.started?app():onboard()}
function onboard(){return `<main class="onboard"><div class="logo">↑</div><div class="eyebrow">Une première version</div><h1>Ascension</h1><p><b>Reprendre le contrôle. Avancer à son rythme.</b></p><p>Un espace personnel pour comprendre ses envies, traverser les moments difficiles et garder une trace du chemin parcouru — sans jugement.</p><div class="card"><b>Confidentialité V1</b><p class="small">Cette version fonctionne localement sur cet appareil. Aucun compte ni serveur n'est nécessaire. Les données sont stockées dans le navigateur.</p></div><button class="btn primary wide" onclick="startSetup()">Commencer</button><p class="small">Ascension ne remplace pas un professionnel de santé. En cas de danger immédiat, contacte les services d'urgence.</p></main>`}
function startSetup(){openSheet('<h2>Ton point de départ</h2><p class="muted">Pas besoin de donner ton nom.</p><label class="small">Comment souhaites-tu appeler ton espace ? (facultatif)</label><input id="setupName" class="input" placeholder="Ex. Stan"><label class="small" style="display:block;margin-top:14px">Ce que tu veux surtout reprendre en main</label><select id="setupGoal" class="input" onchange="toggleTobaccoSetup()"><option value="">Je préfère ne pas préciser</option><option>Tabac</option><option>Alcool</option><option>Jeux d’argent</option><option>Alimentation</option><option>Réseaux sociaux</option><option>Jeux vidéo</option><option>Pornographie / sexualité</option><option>Achats compulsifs</option><option>Autre</option></select><label class="small" style="display:block;margin-top:14px">Date de début / arrêt</label><input id="setupDate" class="input" type="date" value="'+new Date().toISOString().slice(0,10)+'"><div id="tobaccoSetup"></div><p class="small muted">Cette date est ton repère de départ.</p><button class="btn primary wide" onclick="finishSetup()">Entrer dans Ascension</button>')}
function toggleTobaccoSetup(){const e=document.getElementById('tobaccoSetup');if(!e)return;if(document.getElementById('setupGoal').value==='Tabac')e.innerHTML='<div class="card"><h3>Repère cigarettes</h3><label class="small">Cigarettes par jour</label><input id="setupCigs" class="input" type="number" min="0" placeholder="Ex. 15"><label class="small" style="display:block;margin-top:10px">Prix du paquet (€)</label><input id="setupPrice" class="input" type="number" min="0" step="0.01" placeholder="Ex. 12.50"><label class="small" style="display:block;margin-top:10px">Cigarettes par paquet</label><input id="setupSize" class="input" type="number" min="1" value="20"></div>';else e.innerHTML=''}
function finishSetup(){state.started=true;state.name=document.getElementById('setupName').value.trim();state.goal=document.getElementById('setupGoal').value;state.startDate=document.getElementById('setupDate').value;if(state.goal==='Tabac'){state.cigarettesPerDay=document.getElementById('setupCigs')?.value||'';state.packPrice=document.getElementById('setupPrice')?.value||'';state.packSize=Number(document.getElementById('setupSize')?.value||20)}save();closeSheet();render()}
function app(){return `<div class="app"><header class="top"><div class="brand">Asc<span>e</span>nsion</div><div class="pill">V1.4 • privé</div></header><main class="screen">${screen==='home'?home():screen==='understand'?understand():screen==='journal'?journal():screen==='progress'?progress():settings()}</main>${nav()}</div>`}
function home(){return `<section class="hero"><div class="eyebrow">${greeting()}</div><h1>Tu n'as pas besoin d'être parfait.</h1><p>Chaque fois que tu essaies de reprendre le contrôle, tu avances.</p></section><div class="card"><div class="muted small">AUJOURD'HUI</div><div style="display:flex;justify-content:space-between;align-items:end"><div><div class="big">${daysTracked()}</div><div class="muted">jour${daysTracked()>1?'s':''} suivi${daysTracked()>1?'s':''}</div></div><div style="text-align:right"><div class="big">${state.entries.filter(e=>e.type==='envie').length}</div><div class="muted">envie${state.entries.filter(e=>e.type==='envie').length>1?'s':''} enregistrée${state.entries.filter(e=>e.type==='envie').length>1?'s':''}</div></div></div></div><button class="btn primary wide" onclick="support()" style="font-size:18px;padding:18px">🔥 J'ai une envie</button><div class="grid"><button class="btn" onclick="quickJournal()">✍️ Journal</button><button class="btn" onclick="screen='progress';render()">📈 Progression</button></div><div class="card"><h3>Mon cap</h3><p class="muted">${state.goal?esc(state.goal):'Objectif non précisé'}</p><p class="small">${esc(state.mode)}. Une rechute n'efface pas le chemin parcouru.</p></div>${state.trusted?`<div class="card"><h3>Ma personne de confiance</h3><p class="muted">${esc(state.trusted)}</p><button class="btn wide" onclick="callTrusted()">📞 Contacter</button></div>`:''}`}
function greeting(){const h=new Date().getHours();return h<6?'BONNE NUIT':h<12?'BONJOUR':h<18?'BONJOUR': 'BONSOIR'}

let brainStep=0, quizStep=0, quizScore=0;
function understand(){
 return `<section class="hero"><div class="eyebrow">COMPRENDRE</div><h1>Ton cerveau n'est pas ton ennemi.</h1><p>Comprendre ce qui se passe permet de prendre un peu de distance avec l\'envie. Ici, on apprend en touchant, en testant et en observant.</p></section>
 <div class="lesson fade"><h3>🧠 Mission : explorer le cerveau</h3><p class="muted">Trois idées à découvrir. Appuie sur chacune.</p>
 <div class="tapgrid">
  <button class="tapcard" onclick="brainCard('reward')"><b>🎯 Récompense</b><br><span class="small muted">Pourquoi quelque chose devient attirant</span></button>
  <button class="tapcard" onclick="brainCard('habit')"><b>🔁 Habitude</b><br><span class="small muted">Comment un comportement s'automatise</span></button>
  <button class="tapcard" onclick="brainCard('trigger')"><b>⚡ Déclencheur</b><br><span class="small muted">Pourquoi une envie peut surgir</span></button>
  <button class="tapcard" onclick="brainCard('learn')"><b>🌱 Réapprentissage</b><br><span class="small muted">Pourquoi le cerveau peut changer</span></button>
 </div></div>
 <div id="brainLesson" class="lesson"><h3>💡 Une idée importante</h3><p class="muted">Une envie n'est pas un ordre. Le cerveau peut apprendre un comportement, mais il peut aussi apprendre autrement.</p><button class="btn primary wide pulse" onclick="startBrainGame()">🎮 Faire une mini-expérience</button></div>
 <div class="lesson"><h3>❓ Mythe ou réalité ?</h3><p class="muted">Teste ce que tu viens de découvrir.</p><button class="btn wide" onclick="startQuiz()">Commencer le quiz</button></div>
 <div class="lesson"><h3>🔎 Et toi ?</h3><p class="muted">Après avoir compris, observe ce qui se passe chez toi.</p><button class="btn ghost wide" onclick="quickJournal()">Noter une observation</button></div>`;
}
function brainCard(type){
 const data={
 reward:['🎯 La récompense','Certains comportements produisent rapidement un sentiment de récompense ou de soulagement. Le cerveau apprend alors que ce comportement « vaut le coup » et peut être davantage recherché.'],
 habit:['🔁 L\'habitude','Quand un comportement se répète dans un même contexte, le cerveau peut associer le contexte à l\'action. Avec le temps, une partie du comportement peut devenir très automatique.'],
 trigger:['⚡ Le déclencheur','Une situation, une émotion, une personne, un lieu ou même une pensée peut devenir associé au comportement. Le déclencheur peut alors faire apparaître une envie avant même qu\'on ait réfléchi.'],
 learn:['🌱 Le réapprentissage','Le cerveau reste capable d\'apprendre. Modifier progressivement les contextes, les réponses et les habitudes peut permettre de construire de nouveaux automatismes.']
 }[type];
 document.getElementById('brainLesson').innerHTML='<div class="fade"><h3>'+data[0]+'</h3><p class="muted">'+data[1]+'</p><button class="btn primary wide" onclick="startBrainGame()">Continuer →</button></div>';
}
function startBrainGame(){brainStep=0;brainNext();}
function brainNext(){
 const steps=[
 ['1 / 3','Un déclencheur apparaît','Imagine : stress, ennui ou solitude. Ton cerveau reconnaît une situation déjà associée à un comportement.','Je remarque ce qui vient de se passer.'],
 ['2 / 3','L\'envie monte','Une envie peut être forte sans être une obligation d\'agir. Tu peux créer un petit espace entre l\'envie et la réponse.','Je peux attendre quelques instants.'],
 ['3 / 3','Tu choisis une réponse','Changer de pièce, respirer, marcher, appeler quelqu\'un ou écrire peut créer une nouvelle expérience.','Je choisis ce qui m\'aide maintenant.']
 ];
 const s=steps[brainStep];
 openSheet('<div class="fade"><div class="eyebrow">'+s[0]+'</div><h2>'+s[1]+'</h2><p class="muted">'+s[2]+'</p><div class="meter">'+[0,1,2].map(i=>'<i class="'+(i<=brainStep?'on':'')+'"></i>').join('')+'</div><button class="btn primary wide" onclick="brainStep++;'+(brainStep<2?'brainNext()':'finishBrainGame()')+'">'+s[3]+'</button></div>');
}
function finishBrainGame(){closeSheet();toast('Tu viens de créer un nouvel apprentissage');}
function startQuiz(){quizStep=0;quizScore=0;quizAsk();}
function quizAsk(){
 const qs=[
 ['La dopamine est simplement « la molécule du plaisir ».',false,'La dopamine participe à la motivation, à l’apprentissage et au traitement de la récompense. La réduire au plaisir est trop simpliste.'],
 ['Une envie signifie que je vais forcément agir.',false,'Une envie peut être intense sans déterminer automatiquement ce que tu vas faire.'],
 ['Un comportement répété peut devenir plus automatique.',true,'La répétition et le contexte peuvent renforcer les associations et les habitudes.'],
 ['Comprendre un mécanisme suffit toujours à arrêter une addiction.',false,'Comprendre aide, mais ne suffit pas toujours. Un accompagnement peut être nécessaire.']
 ];
 const q=qs[quizStep];
 openSheet('<div class="fade"><div class="eyebrow">QUESTION '+(quizStep+1)+' / '+qs.length+'</div><h2>Mythe ou réalité ?</h2><p>'+q[0]+'</p><button class="choice2" onclick="answerQuiz(true)">✓ Réalité</button><button class="choice2" onclick="answerQuiz(false)">✕ Mythe</button><p class="small muted">Score : '+quizScore+'</p></div>');
}
function answerQuiz(answer){
 const qs=[
 ['La dopamine est simplement « la molécule du plaisir ».',false,'La dopamine participe à la motivation, à l’apprentissage et au traitement de la récompense. La réduire au plaisir est trop simpliste.'],
 ['Une envie signifie que je vais forcément agir.',false,'Une envie peut être intense sans déterminer automatiquement ce que tu vas faire.'],
 ['Un comportement répété peut devenir plus automatique.',true,'La répétition et le contexte peuvent renforcer les associations et les habitudes.'],
 ['Comprendre un mécanisme suffit toujours à arrêter une addiction.',false,'Comprendre aide, mais ne suffit pas toujours. Un accompagnement peut être nécessaire.']
 ];
 const q=qs[quizStep]; if(answer===q[1])quizScore++;
 const last=quizStep===qs.length-1;
 openSheet('<div class="fade"><h2>'+((answer===q[1])?'✅ Bonne réponse':'🧭 Pas tout à fait')+'</h2><p class="muted">'+q[2]+'</p><div class="card"><b>'+quizScore+' / '+(quizStep+1)+'</b></div><button class="btn primary wide" onclick="'+(last?'finishQuiz()':'quizStep++;quizAsk()')+'">'+(last?'Voir mon résultat':'Question suivante')+'</button></div>');
}
function finishQuiz(){const s=quizScore;closeSheet();setTimeout(()=>openSheet('<div class="fade"><div class="eyebrow">TERMINÉ</div><h2>'+s+'/4 — Bien joué.</h2><p class="muted">Le but n’est pas d’avoir tout juste. Le but est de repartir avec une meilleure compréhension de ce qui se passe.</p><button class="btn primary wide" onclick="closeSheet()">Continuer</button></div>'),80);}
function journal(){const entries=[...state.entries].reverse();return `<section class="hero"><div class="eyebrow">MON JOURNAL</div><h1>Comprendre, pas se juger.</h1><p>Note ce qui s'est passé. Avec le temps, les déclencheurs deviennent plus visibles.</p></section><button class="btn primary wide" onclick="quickJournal()">＋ Ajouter une entrée</button><div class="card"><div class="list">${entries.length?entries.map(e=>entryHTML(e)).join(''):`<div class="empty">Ton journal est vide.<br>Tu peux commencer par noter une envie, même petite.</div>`}</div></div>`}
function entryHTML(e){const ts=Array.isArray(e.triggers)?e.triggers:(e.trigger?[e.trigger]:[]);return '<div class="item"><b>'+(e.type==='envie'?'🔥 Envie':'✍️ Note')+' • '+new Date(e.date).toLocaleDateString('fr-FR')+' '+new Date(e.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})+'</b>'+(e.intensity?'<span class="tag">Intensité '+e.intensity+'/10</span>':'')+triggerTags(ts)+'<div style="margin-top:8px">'+esc(e.note||'')+'</div>'+(e.help?'<div class="small muted" style="margin-top:7px">Ce qui a aidé : '+esc(e.help)+'</div>':'')+'</div>'}

 if(!state.objectives.length&&(state.goal||state.startDate))state.objectives.push({id:objectiveId(),type:state.goal||'Autre',label:'',startDate:state.startDate||new Date().toISOString().slice(0,10),cigarettesPerDay:state.cigarettesPerDay||'',packPrice:state.packPrice||'',packSize:Number(state.packSize)||20,spendAmount:'',spendPeriod:'week',baselineMinutes:'',targetMinutes:'',weightEnabled:false,startWeight:'',targetWeight:'',weightLog:[]});

function objectiveDays(o){if(!o||!o.startDate)return 0;const d=new Date(o.startDate+'T00:00:00'),n=new Date(),t=new Date(n.getFullYear(),n.getMonth(),n.getDate());return isNaN(d)?0:Math.max(0,Math.floor((t-d)/86400000))}
function moneySaved(o){const d=objectiveDays(o);if(o.type==='Tabac'){const c=+o.cigarettesPerDay,p=+o.packPrice,z=+o.packSize||20;return c&&p?(d*c/z)*p:null}if(['Jeux d’argent','Alcool','Achats compulsifs'].includes(o.type)){const a=+o.spendAmount;if(!a)return null;return d*a/(o.spendPeriod==='day'?1:o.spendPeriod==='month'?30.4375:7)}return null}
function fmtMinutes(m){m=Math.max(0,Math.round(+m||0));return m>=60?Math.floor(m/60)+' h '+(m%60?m%60+' min':''):m+' min'}
function objectiveTitle(o){return o.type==='Autre'&&o.label?o.label:o.type}
function objectiveExtra(o){
 const d=objectiveDays(o),saved=moneySaved(o);
 if(o.type==='Tabac'&&+o.cigarettesPerDay){const c=Math.floor(d*+o.cigarettesPerDay);return "<div class='counterGrid'><div class='counterStat'><b>🚭 "+c+"</b><div class='small muted'>cigarettes non fumées env.</div></div>"+(saved!==null?"<div class='counterStat'><b>💶 "+saved.toFixed(0)+" €</b><div class='small muted'>économisés env.</div></div>":"")+"</div>"}
 if(TIME_TYPES.includes(o.type)&&+o.baselineMinutes&&+o.targetMinutes>=0){const gain=Math.max(0,+o.baselineMinutes-(+o.targetMinutes||0));return "<div class='counterGrid'><div class='counterStat'><b>⏱️ "+fmtMinutes(o.baselineMinutes)+"</b><div class='small muted'>temps moyen de départ / jour</div></div><div class='counterStat'><b>🎯 "+fmtMinutes(o.targetMinutes)+"</b><div class='small muted'>objectif / jour</div></div></div><div class='counterStat' style='margin-top:10px'><b>🌱 "+fmtMinutes(gain)+"</b><div class='small muted'>temps à récupérer par jour</div></div>"}
 if(saved!==null)return "<div class='counterStat' style='margin-top:10px'><b>💶 "+saved.toFixed(0)+" €</b><div class='small muted'>dépenses évitées estimées</div></div>";
 if(o.type==='Alimentation'&&o.weightEnabled)return weightSummary(o);
 if(o.type==='Autre'&&o.metricKind)return "<div class='counterStat' style='margin-top:10px'><b>📍 "+esc(o.metricLabel||o.metricKind)+"</b><div class='small muted'>repère choisi personnellement</div></div>";
 return "";
}
function weightSummary(o){const log=[...(o.weightLog||[])].sort((a,b)=>String(a.date).localeCompare(String(b.date))),latest=log.length?+log[log.length-1].value:+o.startWeight,start=+o.startWeight,target=+o.targetWeight;if(!start)return "";let txt=latest?latest.toFixed(1)+' kg':'—';let prog='';if(target&&start!==target&&latest){const p=Math.max(0,Math.min(100,((start-latest)/(start-target))*100));prog="<div class='bar' style='margin-top:10px'><i style='width:"+p.toFixed(0)+"%'></i></div><div class='small muted' style='margin-top:6px'>"+p.toFixed(0)+" % du chemin vers l’objectif</div>"}return "<div class='counterStat' style='margin-top:10px'><b>📊 "+txt+"</b><div class='small muted'>dernier repère renseigné — suivi facultatif</div>"+prog+"</div>"}
function objectiveCard(o){const icons={'Tabac':'🚬','Alcool':'🍷','Jeux d’argent':'🎰','Alimentation':'🍽️','Réseaux sociaux':'📱','Jeux vidéo':'🎮','Pornographie / sexualité':'🧭','Achats compulsifs':'🛍️','Autre':'🌱'},d=objectiveDays(o);return "<div class='card'><div style='display:flex;justify-content:space-between;gap:12px;align-items:flex-start'><div><div class='eyebrow'>"+(icons[o.type]||'🌱')+" "+esc(objectiveTitle(o))+"</div><div class='counter'>"+d+" jour"+(d>1?'s':'')+"</div><div class='small muted'>depuis le "+new Date(o.startDate+'T00:00:00').toLocaleDateString('fr-FR')+"</div></div><button class='btn ghost' style='padding:8px 11px' onclick=\"editObjective('"+o.id+"')\">✎</button></div>"+objectiveExtra(o)+(o.type==='Alimentation'&&o.weightEnabled?"<button class='btn ghost wide' style='margin-top:10px' onclick=\"weightTracker('"+o.id+"')\">📊 Mon suivi facultatif</button>":"")+"<p class='small muted'>Ce compteur est un repère, pas une mesure de ta valeur.</p></div>"}
function objectivesHome(){migrateObjectives();return state.objectives.length?state.objectives.map(objectiveCard).join(''):"<div class='card'><h3>Mon premier objectif</h3><p class='muted'>Ajoute ce que tu souhaites reprendre en main. Ascension adaptera les repères.</p></div>"}
function home(){return "<section class='hero'><div class='eyebrow'>"+greeting()+"</div><h1>"+(state.name?esc(state.name)+", tu n'es pas seul.":"Tu n'as pas besoin d'être parfait.")+"</h1><p>Tu peux avancer sur plusieurs choses à la fois, chacune à son rythme.</p></section>"+objectivesHome()+"<button class='btn ghost wide' onclick='addObjective()' style='margin:4px 0 12px'>＋ Ajouter un objectif</button><button class='btn primary wide pulse' onclick='supportV14()' style='font-size:18px;padding:19px'>🔥 J'ai besoin d'Ascension</button><div class='grid'><button class='btn' onclick='quickJournal()'>✍️ Journal</button><button class='btn' onclick=\"screen='progress';render()\">📈 Progression</button></div>"+(state.why?"<div class='card'><div class='eyebrow'>MON POURQUOI</div><p style='font-size:18px;line-height:1.5'>« "+esc(state.why)+" »</p></div>":"<div class='card'><h3>❤️ Pourquoi es-tu ici ?</h3><button class='btn wide' onclick='setWhy()'>Définir mon pourquoi</button></div>")}
function objectiveFields(type,o={}){
 if(type==='Tabac')return "<div class='card'><h3>Repères tabac</h3><label class='small'>Cigarettes par jour</label><input id='objCigs' class='input' type='number' min='0' value='"+esc(o.cigarettesPerDay||'')+"'><label class='small' style='display:block;margin-top:10px'>Prix du paquet (€)</label><input id='objPackPrice' class='input' type='number' min='0' step='.01' value='"+esc(o.packPrice||'')+"'><label class='small' style='display:block;margin-top:10px'>Cigarettes par paquet</label><input id='objPackSize' class='input' type='number' min='1' value='"+esc(o.packSize||20)+"'></div>";
 if(TIME_TYPES.includes(type))return "<div class='card'><h3>Repère temps</h3><p class='small muted'>Des moyennes personnelles, pas un jugement.</p><label class='small'>Temps moyen actuel par jour (minutes)</label><input id='objBaseline' class='input' type='number' min='0' value='"+esc(o.baselineMinutes||'')+"' placeholder='Ex. 240'><label class='small' style='display:block;margin-top:10px'>Objectif par jour (minutes)</label><input id='objTarget' class='input' type='number' min='0' value='"+esc(o.targetMinutes||'')+"' placeholder='Ex. 120'></div>";
 if(['Jeux d’argent','Alcool','Achats compulsifs'].includes(type))return "<div class='card'><h3>Repère financier <span class='small muted'>(facultatif)</span></h3><input id='objSpend' class='input' type='number' min='0' step='.01' value='"+esc(o.spendAmount||'')+"' placeholder='Dépense moyenne'><select id='objPeriod' class='input' style='margin-top:10px'><option value='day' "+(o.spendPeriod==='day'?'selected':'')+">par jour</option><option value='week' "+(!o.spendPeriod||o.spendPeriod==='week'?'selected':'')+">par semaine</option><option value='month' "+(o.spendPeriod==='month'?'selected':'')+">par mois</option></select></div>";
 if(type==='Alimentation')return "<div class='card'><h3>Suivi personnel facultatif</h3><p class='small muted'>Le poids n’est jamais nécessaire pour utiliser Ascension et ne mesure pas ta réussite.</p><label><input id='objWeightEnabled' type='checkbox' "+(o.weightEnabled?'checked':'')+"> Activer un tableau de suivi du poids</label><label class='small' style='display:block;margin-top:10px'>Poids de départ (kg)</label><input id='objStartWeight' class='input' type='number' min='0' step='.1' value='"+esc(o.startWeight||'')+"'><label class='small' style='display:block;margin-top:10px'>Poids souhaité (kg, facultatif)</label><input id='objTargetWeight' class='input' type='number' min='0' step='.1' value='"+esc(o.targetWeight||'')+"'></div>";
 if(type==='Autre')return "<div class='card'><h3>Ton objectif</h3><label class='small'>Qu’est-ce que tu souhaites reprendre en main ?</label><input id='objLabel' class='input' value='"+esc(o.label||'')+"' placeholder='Ex. boissons sucrées'><label class='small' style='display:block;margin-top:10px'>Quel repère te paraît le plus utile ?</label><select id='objMetricKind' class='input'><option value='days'>Jours / continuité</option><option value='time' "+(o.metricKind==='time'?'selected':'')+">Temps passé</option><option value='frequency' "+(o.metricKind==='frequency'?'selected':'')+">Fréquence</option><option value='quantity' "+(o.metricKind==='quantity'?'selected':'')+">Quantité</option><option value='money' "+(o.metricKind==='money'?'selected':'')+">Dépenses</option></select><input id='objMetricLabel' class='input' style='margin-top:10px' value='"+esc(o.metricLabel||'')+"' placeholder='Nom du repère, facultatif'><p class='small muted'>Pour cette bêta, Ascension te laisse choisir le repère plutôt que de poser un diagnostic automatiquement.</p></div>";
 return "";
}
function readObjectiveFields(o,type){
 if(type==='Tabac'){o.cigarettesPerDay=document.getElementById('objCigs')?.value||'';o.packPrice=document.getElementById('objPackPrice')?.value||'';o.packSize=+(document.getElementById('objPackSize')?.value||20)}
 if(TIME_TYPES.includes(type)){o.baselineMinutes=document.getElementById('objBaseline')?.value||'';o.targetMinutes=document.getElementById('objTarget')?.value||''}
 if(['Jeux d’argent','Alcool','Achats compulsifs'].includes(type)){o.spendAmount=document.getElementById('objSpend')?.value||'';o.spendPeriod=document.getElementById('objPeriod')?.value||'week'}
 if(type==='Alimentation'){o.weightEnabled=!!document.getElementById('objWeightEnabled')?.checked;o.startWeight=document.getElementById('objStartWeight')?.value||'';o.targetWeight=document.getElementById('objTargetWeight')?.value||'';o.weightLog=o.weightLog||[]}
 if(type==='Autre'){o.label=document.getElementById('objLabel')?.value.trim()||'';o.metricKind=document.getElementById('objMetricKind')?.value||'days';o.metricLabel=document.getElementById('objMetricLabel')?.value.trim()||''}
}
function addObjective(){const today=new Date().toISOString().slice(0,10);openSheet("<h2>Ajouter un objectif</h2><p class='muted'>Ascension adaptera le suivi à ce que tu choisis.</p><select id='objType' class='input' onchange='refreshObjectiveFields()'>"+OBJECTIVE_TYPES.map(x=>"<option>"+x+"</option>").join('')+"</select><label class='small' style='display:block;margin-top:12px'>Date de départ</label><input id='objDate' class='input' type='date' value='"+today+"'><div id='objFields'>"+objectiveFields('Tabac')+"</div><button class='btn primary wide' onclick='saveObjective()'>Ajouter cet objectif</button>")}
function refreshObjectiveFields(){const t=document.getElementById('objType').value;document.getElementById('objFields').innerHTML=objectiveFields(t)}
function saveObjective(){const type=document.getElementById('objType').value,date=document.getElementById('objDate').value;if(!date)return toast('Choisis une date de départ');const o={id:objectiveId(),type,startDate:date,weightLog:[]};readObjectiveFields(o,type);state.objectives.push(o);save();closeSheet();render();toast('Nouvel objectif ajouté')}
function editObjective(id){const o=state.objectives.find(x=>x.id===id);if(!o)return;openSheet("<h2>"+esc(objectiveTitle(o))+"</h2><label class='small'>Date de départ</label><input id='editObjDate' class='input' type='date' value='"+esc(o.startDate)+"'><div>"+objectiveFields(o.type,o)+"</div><button class='btn primary wide' onclick=\"saveObjectiveEdit('"+id+"')\">Enregistrer</button><button class='btn danger wide' style='margin-top:10px' onclick=\"removeObjective('"+id+"')\">Retirer cet objectif</button>")}
function saveObjectiveEdit(id){const o=state.objectives.find(x=>x.id===id);if(!o)return;o.startDate=document.getElementById('editObjDate').value||o.startDate;readObjectiveFields(o,o.type);save();closeSheet();render();toast('Objectif mis à jour')}
function removeObjective(id){if(!confirm('Retirer cet objectif de l’accueil ? Ton journal reste conservé.'))return;state.objectives=state.objectives.filter(x=>x.id!==id);save();closeSheet();render();toast('Objectif retiré')}
function weightTracker(id){const o=state.objectives.find(x=>x.id===id);if(!o)return;const rows=(o.weightLog||[]).map(x=>"<div class='item'><b>"+new Date(x.date+'T00:00:00').toLocaleDateString('fr-FR')+"</b>"+(+x.value).toFixed(1)+" kg</div>").join('');openSheet("<h2>📊 Mon suivi</h2><p class='muted'>Tu remplis ce tableau seulement si tu le souhaites.</p>"+(rows||"<p class='muted'>Aucune mesure enregistrée.</p>")+"<label class='small'>Nouvelle mesure</label><input id='weightValue' class='input' type='number' min='0' step='.1' placeholder='kg'><button class='btn primary wide' style='margin-top:10px' onclick=\"addWeight('"+id+"')\">Ajouter</button><p class='small muted'>Le poids est un repère facultatif. Il ne mesure pas ta réussite.</p>")}
function addWeight(id){const o=state.objectives.find(x=>x.id===id),v=+document.getElementById('weightValue').value;if(!o||!v)return toast('Indique une valeur');o.weightLog=o.weightLog||[];o.weightLog.push({date:new Date().toISOString().slice(0,10),value:v});o.weightLog.sort((a,b)=>String(a.date).localeCompare(String(b.date)));save();weightTracker(id);render();toast('Mesure enregistrée')}
function supportV14(){const os=state.objectives||[];if(os.length===1)return supportForObjective(os[0].id);if(!os.length)return support();openSheet("<div class='eyebrow'>JE SUIS LÀ</div><h2>Cette envie concerne quoi ?</h2><p class='muted'>Choisis l’objectif qui correspond le mieux à ce moment.</p>"+os.map(o=>"<button class='btn choice' onclick=\"supportForObjective('"+o.id+"')\">"+esc(objectiveTitle(o))+"</button>").join('')+"<button class='btn ghost wide' onclick='support()'>Je ne sais pas / autre</button>")}
function supportForObjective(id){const o=state.objectives.find(x=>x.id===id);if(!o)return support();if(o.type==='Alimentation')return foodSupport(id);state.activeSupportObjective=id;support()}
function foodSupport(id){state.activeSupportObjective=id;openSheet("<div class='eyebrow'>ALIMENTATION</div><h2>Qu’est-ce qui ressemble le plus à ce moment ?</h2><p class='muted'>Il n’y a pas de mauvaise réponse. Le but est seulement de comprendre ce qui se passe.</p><button class='btn choice' onclick=\"foodAdvice('hunger')\">🍽️ J’ai réellement faim</button><button class='btn choice' onclick=\"foodAdvice('craving')\">🍫 J’ai une envie particulière</button><button class='btn choice' onclick=\"foodAdvice('stress')\">🫂 Stress / émotion</button><button class='btn choice' onclick=\"foodAdvice('boredom')\">🌙 Ennui / habitude</button><button class='btn choice' onclick=\"foodAdvice('unknown')\">❓ Je ne sais pas</button>")}
function foodAdvice(kind){const d={hunger:['Tu as faim ? Manger n’est pas un échec.','Prends le temps de manger quelque chose qui te rassasie. Une faim physique n’a pas besoin d’être combattue.'],craving:['Une envie particulière peut passer ou changer.','Bois quelque chose si tu en as envie, éloigne-toi quelques minutes du déclencheur et réévalue ensuite. Si tu choisis de manger, fais-le sans te juger.'],stress:['L’émotion mérite aussi d’être entendue.','Essaie quelques minutes de respiration, une courte marche, un message à quelqu’un ou mets des mots sur ce que tu ressens avant de décider.'],boredom:['Changer de contexte peut casser l’automatisme.','Change de pièce ou d’activité pendant quelques minutes, puis demande-toi à nouveau ce dont tu as besoin.'],unknown:['Pas besoin d’avoir la réponse tout de suite.','Accorde-toi quelques minutes. Observe la sensation, bois si tu le souhaites, puis décide tranquillement.']}[kind];openSheet("<div class='eyebrow'>TRAVERSER L’ENVIE</div><h2>"+d[0]+"</h2><p class='muted'>"+d[1]+"</p><button class='btn primary wide' onclick='support()'>Continuer avec le mode soutien</button><button class='btn ghost wide' style='margin-top:10px' onclick='closeSheet()'>Ça va mieux pour le moment</button><p class='small muted'>Ascension ne recommande ni restriction extrême ni produit coupe-faim.</p>")}
function settings(){migrateObjectives();return "<section class='hero'><div class='eyebrow'>PARAMÈTRES</div><h1>Tu contrôles tes données.</h1><p>Ascension fonctionne localement sur cet appareil.</p></section><div class='card'><h3>Mon espace</h3><label class='small'>Nom affiché (facultatif)</label><input class='input' value='"+esc(state.name)+"' onchange='state.name=this.value;save()'></div><div class='card'><h3>Mes objectifs</h3><p class='small muted'>Chaque objectif possède ses propres repères.</p>"+(state.objectives.length?state.objectives.map(o=>"<button class='btn choice' onclick=\"editObjective('"+o.id+"')\"><b>"+esc(objectiveTitle(o))+"</b><br><span class='small muted'>Depuis le "+new Date(o.startDate+'T00:00:00').toLocaleDateString('fr-FR')+"</span></button>").join(''):"<p class='muted'>Aucun objectif.</p>")+"<button class='btn primary wide' onclick='addObjective()'>＋ Ajouter un objectif</button></div><div class='card'><h3>Personne de confiance</h3><p class='small muted'>Ascension ne contacte personne automatiquement.</p><input id='trusted' class='input' placeholder='Nom / téléphone' value='"+esc(state.trusted)+"'><button class='btn wide' style='margin-top:10px' onclick='saveTrusted()'>Enregistrer</button></div><div class='card'><h3>Données</h3><p class='small muted'>Les données restent dans le stockage local du navigateur.</p><button class='btn danger wide' onclick='eraseAll()'>Effacer toutes mes données</button></div><div class='card'><h3>À propos</h3><p class='small muted'><b>Ascension V1.4</b><br>Un compteur est un repère, pas une mesure de ta valeur.</p></div>"}
render();
</script>
</body>
