<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b1220">
<meta name="description" content="Ascension — reprendre le contrôle, avancer à son rythme.">
<link rel="manifest" href="./manifest.webmanifest">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Ascension">
<title>Ascension — V1.4</title>
<style>
:root{--bg:#07101f;--panel:#0e1a2c;--panel2:#13243a;--text:#f5f7fb;--muted:#a8b4c7;--accent:#8b7cff;--accent2:#5eead4;--danger:#fb7185;--line:#22324a;--shadow:0 20px 50px rgba(0,0,0,.25)}
*{box-sizing:border-box}html,body{margin:0;background:linear-gradient(180deg,#07101f,#0a1424 55%,#07101f);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,textarea,select{font:inherit}button{cursor:pointer}.app{max-width:480px;margin:auto;min-height:100vh;padding-bottom:90px}.top{padding:28px 20px 12px;display:flex;justify-content:space-between;align-items:center}.brand{font-size:23px;font-weight:800;letter-spacing:.2px}.brand span{color:var(--accent)}.pill{font-size:12px;color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:7px 10px}.screen{padding:10px 18px}.hero{padding:24px 4px 10px}.eyebrow{color:var(--accent2);font-size:12px;font-weight:700;text-transform:uppercase;letter-spacing:1.5px}.hero h1{font-size:34px;line-height:1.05;margin:9px 0 12px}.hero p{color:var(--muted);line-height:1.55;margin:0}.card{background:rgba(14,26,44,.88);border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0;box-shadow:var(--shadow)}.card h2,.card h3{margin:0 0 8px}.muted{color:var(--muted)}.big{font-size:42px;font-weight:800}.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}.btn{border:0;border-radius:16px;padding:14px 16px;background:var(--panel2);color:var(--text);font-weight:700}.btn.primary{background:linear-gradient(135deg,#8b7cff,#6f64e8)}.btn.ghost{background:transparent;border:1px solid var(--line)}.btn.danger{background:rgba(251,113,133,.12);border:1px solid rgba(251,113,133,.35);color:#fecdd3}.btn:active{transform:scale(.98)}.wide{width:100%}.choice{display:block;width:100%;text-align:left;margin:9px 0}.choice.selected{outline:2px solid var(--accent);background:rgba(139,124,255,.15)}.range{width:100%;accent-color:var(--accent)}.intensity{display:flex;justify-content:space-between;align-items:center}.intensity strong{font-size:34px}.nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(480px,100%);background:rgba(7,16,31,.95);backdrop-filter:blur(16px);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);padding:9px 8px calc(9px + env(safe-area-inset-bottom));z-index:10}.nav button{background:none;border:0;color:var(--muted);font-size:11px;padding:7px 2px}.nav button.active{color:var(--text)}.nav .ico{display:block;font-size:20px;margin-bottom:3px}.list{display:flex;flex-direction:column;gap:9px}.item{padding:13px;border:1px solid var(--line);border-radius:15px;background:rgba(19,36,58,.55)}.item b{display:block;margin-bottom:4px}.tag{display:inline-block;font-size:11px;border-radius:999px;padding:4px 7px;background:rgba(94,234,212,.1);color:var(--accent2);margin:3px 3px 0 0}.modal{position:fixed;inset:0;background:rgba(0,0,0,.68);display:none;align-items:flex-end;z-index:20}.modal.show{display:flex}.sheet{width:min(480px,100%);margin:auto 0 0;background:#0b1728;border:1px solid var(--line);border-radius:28px 28px 0 0;padding:22px;max-height:92vh;overflow:auto}.sheet h2{margin-top:0}.input{width:100%;background:#091426;border:1px solid var(--line);border-radius:14px;color:var(--text);padding:13px;outline:none}.textarea{min-height:100px;resize:vertical}.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%) translateY(20px);background:#f5f7fb;color:#07101f;padding:11px 14px;border-radius:13px;font-weight:700;opacity:0;pointer-events:none;transition:.25s;z-index:30}.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}.bar{height:8px;background:#1a2940;border-radius:99px;overflow:hidden}.bar>i{display:block;height:100%;background:linear-gradient(90deg,#8b7cff,#5eead4);border-radius:99px}.onboard{min-height:100vh;display:flex;flex-direction:column;justify-content:center;padding:28px}.logo{width:72px;height:72px;border-radius:24px;background:linear-gradient(135deg,#8b7cff,#5eead4);display:grid;place-items:center;font-size:36px;font-weight:900;color:#07101f;margin-bottom:25px}.onboard h1{font-size:42px;margin:0 0 10px}.onboard p{color:var(--muted);line-height:1.6}.small{font-size:12px;line-height:1.5}.success{color:#5eead4}.empty{padding:25px 8px;text-align:center;color:var(--muted)}

/* V1.2 — Comprendre interactif */
.lesson{background:linear-gradient(145deg,rgba(19,36,58,.95),rgba(14,26,44,.95));border:1px solid var(--line);border-radius:22px;padding:18px;margin:12px 0}
.lesson h3{margin:0 0 7px}.tapgrid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:12px}
.tapcard{border:1px solid var(--line);border-radius:18px;padding:15px;background:#101f33;color:var(--text);text-align:left}
.tapcard:active{transform:scale(.98)}.pulse{animation:pulse 1.8s infinite}
@keyframes pulse{0%,100%{box-shadow:0 0 0 0 rgba(139,124,255,.0)}50%{box-shadow:0 0 0 8px rgba(139,124,255,.08)}}
.meter{display:flex;gap:5px;margin:12px 0}.meter i{height:9px;flex:1;background:#1a2940;border-radius:9px}.meter i.on{background:linear-gradient(90deg,#8b7cff,#5eead4)}
.choice2{width:100%;text-align:left;margin:8px 0;border:1px solid var(--line);border-radius:16px;padding:13px;background:#101f33;color:var(--text)}
.choice2.correct{border-color:#5eead4;background:rgba(94,234,212,.10)}.choice2.wrong{border-color:#fb7185;background:rgba(251,113,133,.10)}
.fade{animation:fade .28s ease}@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
</style>
</head>
<body>
<div id="singleFileInfo" style="margin:14px 0;padding:12px 14px;border-radius:14px;background:rgba(139,124,255,.10);font-size:13px;line-height:1.45;color:inherit;">
  <strong>Ascension V1.4 — test iPhone/Mac</strong><br>
  Cette version est autonome pour le premier test. Les données restent dans le stockage local de Safari.
</div>

<div id="root"></div>
<div id="toast" class="toast"></div>
<div id="supportModal" class="modal"></div>
<script>
const KEY='ascension_v1';
const defaults={started:false,goal:'',mode:'Reprise de contrôle',name:'',entries:[],trusted:'',notifications:false};
let storedState=null;
try{storedState=JSON.parse(localStorage.getItem(KEY)||'null')}catch(e){storedState=null}
let state={...defaults,...(storedState||{})};
if(!Array.isArray(state.entries))state.entries=[];
if(typeof state.goal!=='string')state.goal='';
if(typeof state.mode!=='string')state.mode=defaults.mode;
if(typeof state.name!=='string')state.name='';
if(typeof state.trusted!=='string')state.trusted='';
let screen='home';
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
function save(){localStorage.setItem(KEY,JSON.stringify(state))}
function toast(t){const e=document.getElementById('toast');e.textContent=t;e.classList.add('show');setTimeout(()=>e.classList.remove('show'),1800)}
function daysTracked(){if(!state.entries.length)return 0;const ds=[...new Set(state.entries.map(e=>e.date.slice(0,10)))];return ds.length}
function render(){document.getElementById('root').innerHTML=state.started?app():onboard()}
function onboard(){return `<main class="onboard"><div class="logo">↑</div><div class="eyebrow">Une première version</div><h1>Ascension</h1><p><b>Reprendre le contrôle. Avancer à son rythme.</b></p><p>Un espace personnel pour comprendre ses envies, traverser les moments difficiles et garder une trace du chemin parcouru — sans jugement.</p><div class="card"><b>Confidentialité V1</b><p class="small">Cette version fonctionne localement sur cet appareil. Aucun compte ni serveur n'est nécessaire. Les données sont stockées dans le navigateur.</p></div><button class="btn primary wide" onclick="startSetup()">Commencer</button><p class="small">Ascension ne remplace pas un professionnel de santé. En cas de danger immédiat, contacte les services d'urgence.</p></main>`}
function startSetup(){openSheet(`<h2>Ton point de départ</h2><p class="muted">Pas besoin de donner ton nom.</p><label class="small">Comment souhaites-tu appeler ton espace ? (facultatif)</label><input id="setupName" class="input" placeholder="Ex. Stan"><label class="small" style="display:block;margin-top:14px">Ce que tu veux surtout reprendre en main</label><select id="setupGoal" class="input"><option value="">Je préfère ne pas préciser</option><option>Tabac</option><option>Alcool</option><option>Jeux d’argent</option><option>Alimentation</option><option>Réseaux sociaux</option><option>Jeux vidéo</option><option>Pornographie / sexualité</option><option>Achats compulsifs</option><option>Autre</option></select><p class="small muted">Tu pourras modifier cela plus tard. Ce choix ne constitue pas un diagnostic.</p><button class="btn primary wide" onclick="finishSetup()">Entrer dans Ascension</button>`)}
function finishSetup(){state.started=true;state.name=document.getElementById('setupName').value.trim();state.goal=document.getElementById('setupGoal').value;save();closeSheet();render()}
function app(){return `<div class="app"><header class="top"><div class="brand">Asc<span>e</span>nsion</div><div class="pill">V1.4 • privé</div></header><main class="screen">${screen==='home'?home():screen==='understand'?understand():screen==='journal'?journal():screen==='progress'?progress():settings()}</main>${nav()}</div>`}
function home(){return `<section class="hero"><div class="eyebrow">${greeting()}</div><h1>Tu n'as pas besoin d'être parfait.</h1><p>Chaque fois que tu essaies de reprendre le contrôle, tu avances.</p></section><div class="card"><div class="muted small">AUJOURD'HUI</div><div style="display:flex;justify-content:space-between;align-items:end"><div><div class="big">${daysTracked()}</div><div class="muted">jour${daysTracked()>1?'s':''} suivi${daysTracked()>1?'s':''}</div></div><div style="text-align:right"><div class="big">${state.entries.filter(e=>e.type==='envie').length}</div><div class="muted">envie${state.entries.filter(e=>e.type==='envie').length>1?'s':''} enregistrée${state.entries.filter(e=>e.type==='envie').length>1?'s':''}</div></div></div></div><button class="btn primary wide" onclick="support()" style="font-size:18px;padding:18px">🔥 J'ai une envie</button><div class="grid"><button class="btn" onclick="quickJournal()">✍️ Journal</button><button class="btn" onclick="screen='progress';render()">📈 Progression</button></div><div class="card"><h3>Mon cap</h3><p class="muted">${state.goal?esc(state.goal):'Objectif non précisé'}</p><p class="small">${esc(state.mode)}. Une rechute n'efface pas le chemin parcouru.</p></div>${state.trusted?`<div class="card"><h3>Ma personne de confiance</h3><p class="muted">${esc(state.trusted)}</p><button class="btn wide" onclick="callTrusted()">📞 Contacter</button></div>`:''}`}
function greeting(){const h=new Date().getHours();return h<6?'BONNE NUIT':h<12?'BONJOUR':h<18?'BONJOUR': 'BONSOIR'}

let brainStep=0, quizStep=0, quizScore=0;
function understand(){
 return `<section class="hero"><div class="eyebrow">COMPRENDRE</div><h1>Ton cerveau n'est pas ton ennemi.</h1><p>Comprendre ce qui se passe permet de prendre un peu de distance avec l\'envie. Ici, on apprend en touchant, en testant et en observant.</p></section>
 <div class="lesson fade"><h3>🧠 Mission : explorer le cerveau</h3><p class="muted">Trois idées à découvrir. Appuie sur chacune.</p>
 <div class="tapgrid">
  <button class="tapcard" onclick="brainCard('reward')"><b>🎯 Récompense</b><br><span class="small muted">Pourquoi quelque chose devient attirant</span></button>
  <button class="tapcard" onclick="brainCard('habit')"><b>🔁 Habitude</b><br><span class="small muted">Comment un comportement s'automatise</span></button>
  <button class="tapcard" onclick="brainCard('trigger')"><b>⚡ Déclencheur</b><br><span class="small muted">Pourquoi une envie peut surgir</span></button>
  <button class="tapcard" onclick="brainCard('learn')"><b>🌱 Réapprentissage</b><br><span class="small muted">Pourquoi le cerveau peut changer</span></button>
 </div></div>
 <div id="brainLesson" class="lesson"><h3>💡 Une idée importante</h3><p class="muted">Une envie n'est pas un ordre. Le cerveau peut apprendre un comportement, mais il peut aussi apprendre autrement.</p><button class="btn primary wide pulse" onclick="startBrainGame()">🎮 Faire une mini-expérience</button></div>
 <div class="lesson"><h3>❓ Mythe ou réalité ?</h3><p class="muted">Teste ce que tu viens de découvrir.</p><button class="btn wide" onclick="startQuiz()">Commencer le quiz</button></div>
 <div class="lesson"><h3>🔎 Et toi ?</h3><p class="muted">Après avoir compris, observe ce qui se passe chez toi.</p><button class="btn ghost wide" onclick="quickJournal()">Noter une observation</button></div>`;
}
function brainCard(type){
 const data={
 reward:['🎯 La récompense','Certains comportements produisent rapidement un sentiment de récompense ou de soulagement. Le cerveau apprend alors que ce comportement « vaut le coup » et peut être davantage recherché.'],
 habit:['🔁 L\'habitude','Quand un comportement se répète dans un même contexte, le cerveau peut associer le contexte à l\'action. Avec le temps, une partie du comportement peut devenir très automatique.'],
 trigger:['⚡ Le déclencheur','Une situation, une émotion, une personne, un lieu ou même une pensée peut devenir associé au comportement. Le déclencheur peut alors faire apparaître une envie avant même qu\'on ait réfléchi.'],
 learn:['🌱 Le réapprentissage','Le cerveau reste capable d\'apprendre. Modifier progressivement les contextes, les réponses et les habitudes peut permettre de construire de nouveaux automatismes.']
 }[type];
 document.getElementById('brainLesson').innerHTML='<div class="fade"><h3>'+data[0]+'</h3><p class="muted">'+data[1]+'</p><button class="btn primary wide" onclick="startBrainGame()">Continuer →</button></div>';
}
function startBrainGame(){brainStep=0;brainNext();}
function brainNext(){
 const steps=[
 ['1 / 3','Un déclencheur apparaît','Imagine : stress, ennui ou solitude. Ton cerveau reconnaît une situation déjà associée à un comportement.','Je remarque ce qui vient de se passer.'],
 ['2 / 3','L\'envie monte','Une envie peut être forte sans être une obligation d\'agir. Tu peux créer un petit espace entre l\'envie et la réponse.','Je peux attendre quelques instants.'],
 ['3 / 3','Tu choisis une réponse','Changer de pièce, respirer, marcher, appeler quelqu\'un ou écrire peut créer une nouvelle expérience.','Je choisis ce qui m\'aide maintenant.']
 ];
 const s=steps[brainStep];
 openSheet('<div class="fade"><div class="eyebrow">'+s[0]+'</div><h2>'+s[1]+'</h2><p class="muted">'+s[2]+'</p><div class="meter">'+[0,1,2].map(i=>'<i class="'+(i<=brainStep?'on':'')+'"></i>').join('')+'</div><button class="btn primary wide" onclick="brainStep++;'+(brainStep<2?'brainNext()':'finishBrainGame()')+'">'+s[3]+'</button></div>');
}
function finishBrainGame(){closeSheet();toast('Tu viens de créer un nouvel apprentissage');}
function startQuiz(){quizStep=0;quizScore=0;quizAsk();}
function quizAsk(){
 const qs=[
 ['La dopamine est simplement « la molécule du plaisir ».',false,'La dopamine participe à la motivation, à l’apprentissage et au traitement de la récompense. La réduire au plaisir est trop simpliste.'],
 ['Une envie signifie que je vais forcément agir.',false,'Une envie peut être intense sans déterminer automatiquement ce que tu vas faire.'],
 ['Un comportement répété peut devenir plus automatique.',true,'La répétition et le contexte peuvent renforcer les associations et les habitudes.'],
 ['Comprendre un mécanisme suffit toujours à arrêter une addiction.',false,'Comprendre aide, mais ne suffit pas toujours. Un accompagnement peut être nécessaire.']
 ];
 const q=qs[quizStep];
 openSheet('<div class="fade"><div class="eyebrow">QUESTION '+(quizStep+1)+' / '+qs.length+'</div><h2>Mythe ou réalité ?</h2><p>'+q[0]+'</p><button class="choice2" onclick="answerQuiz(true)">✓ Réalité</button><button class="choice2" onclick="answerQuiz(false)">✕ Mythe</button><p class="small muted">Score : '+quizScore+'</p></div>');
}
function answerQuiz(answer){
 const qs=[
 ['La dopamine est simplement « la molécule du plaisir ».',false,'La dopamine participe à la motivation, à l’apprentissage et au traitement de la récompense. La réduire au plaisir est trop simpliste.'],
 ['Une envie signifie que je vais forcément agir.',false,'Une envie peut être intense sans déterminer automatiquement ce que tu vas faire.'],
 ['Un comportement répété peut devenir plus automatique.',true,'La répétition et le contexte peuvent renforcer les associations et les habitudes.'],
 ['Comprendre un mécanisme suffit toujours à arrêter une addiction.',false,'Comprendre aide, mais ne suffit pas toujours. Un accompagnement peut être nécessaire.']
 ];
 const q=qs[quizStep]; if(answer===q[1])quizScore++;
 const last=quizStep===qs.length-1;
 openSheet('<div class="fade"><h2>'+((answer===q[1])?'✅ Bonne réponse':'🧭 Pas tout à fait')+'</h2><p class="muted">'+q[2]+'</p><div class="card"><b>'+quizScore+' / '+(quizStep+1)+'</b></div><button class="btn primary wide" onclick="'+(last?'finishQuiz()':'quizStep++;quizAsk()')+'">'+(last?'Voir mon résultat':'Question suivante')+'</button></div>');
}
function finishQuiz(){const s=quizScore;closeSheet();setTimeout(()=>openSheet('<div class="fade"><div class="eyebrow">TERMINÉ</div><h2>'+s+'/4 — Bien joué.</h2><p class="muted">Le but n’est pas d’avoir tout juste. Le but est de repartir avec une meilleure compréhension de ce qui se passe.</p><button class="btn primary wide" onclick="closeSheet()">Continuer</button></div>'),80);}
function journal(){const entries=[...state.entries].reverse();return `<section class="hero"><div class="eyebrow">MON JOURNAL</div><h1>Comprendre, pas se juger.</h1><p>Note ce qui s'est passé. Avec le temps, les déclencheurs deviennent plus visibles.</p></section><button class="btn primary wide" onclick="quickJournal()">＋ Ajouter une entrée</button><div class="card"><div class="list">${entries.length?entries.map(e=>entryHTML(e)).join(''):`<div class="empty">Ton journal est vide.<br>Tu peux commencer par noter une envie, même petite.</div>`}</div></div>`}
function entryHTML(e){return `<div class="item"><b>${e.type==='envie'?'🔥 Envie':'✍️ Note'} • ${new Date(e.date).toLocaleDateString('fr-FR')} ${new Date(e.date).toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'})}</b>${e.intensity?`<span class="tag">Intensité ${e.intensity}/10</span>`:''}${e.trigger?`<span class="tag">${esc(e.trigger)}</span>`:''}<div style="margin-top:8px">${esc(e.note||'')}</div>${e.help?`<div class="small muted" style="margin-top:7px">Ce qui a aidé : ${esc(e.help)}</div>`:''}</div>`}
function quickJournal(){openSheet(`<h2>Ajouter au journal</h2><label class="small">Type</label><select id="jtype" class="input"><option value="note">Note personnelle</option><option value="envie">Envie</option></select><label class="small" style="display:block;margin-top:12px">Intensité (si envie)</label><input id="jint" class="range" type="range" min="1" max="10" value="5" oninput="document.getElementById('jval').textContent=this.value"><div class="intensity"><span>Faible</span><strong id="jval">5</strong><span>Forte</span></div><label class="small">Déclencheur</label><select id="jtrigger" class="input"><option value="">Je ne sais pas</option><option>Stress</option><option>Ennui</option><option>Solitude</option><option>Habitude</option><option>Manque</option><option>Tristesse</option><option>Colère</option><option>Sortie / fête</option><option>Voir / entendre un déclencheur</option><option>Autre</option></select><label class="small" style="display:block;margin-top:12px">Ce qui s'est passé</label><textarea id="jnote" class="input textarea" placeholder="Écris ce que tu veux garder de ce moment..."></textarea><label class="small" style="display:block;margin-top:12px">Ce qui a aidé</label><input id="jhelp" class="input" placeholder="Ex. marcher, appeler quelqu\'un..."><button class="btn primary wide" onclick="addJournal()" style="margin-top:14px">Enregistrer</button>`)}
function addJournal(){const note=document.getElementById('jnote').value.trim();if(!note){toast('Ajoute au moins une note');return}state.entries.push({date:new Date().toISOString(),type:document.getElementById('jtype').value,intensity:document.getElementById('jint').value,trigger:document.getElementById('jtrigger').value,note,help:document.getElementById('jhelp').value.trim()});save();closeSheet();screen='journal';render();toast('Entrée enregistrée')}
function progress(){const urges=state.entries.filter(e=>e.type==='envie');const avg=urges.length?(urges.reduce((a,e)=>a+Number(e.intensity||0),0)/urges.length).toFixed(1):'—';const triggers={};urges.forEach(e=>{if(e.trigger)triggers[e.trigger]=(triggers[e.trigger]||0)+1});const top=Object.entries(triggers).sort((a,b)=>b[1]-a[1]).slice(0,3);return `<section class="hero"><div class="eyebrow">MA PROGRESSION</div><h1>Ton chemin, pas une note.</h1><p>Les chiffres servent à comprendre ton parcours. Ils ne mesurent pas ta valeur.</p></section><div class="grid"><div class="card"><div class="muted small">JOURS SUIVIS</div><div class="big">${daysTracked()}</div></div><div class="card"><div class="muted small">ENVIES NOTÉES</div><div class="big">${urges.length}</div></div></div><div class="card"><h3>Intensité moyenne des envies</h3><div class="big">${avg}${avg!=='—'?'/10':''}</div><div class="bar" style="margin-top:10px"><i style="width:${avg==='—'?0:Number(avg)*10}%"></i></div></div><div class="card"><h3>Déclencheurs les plus fréquents</h3>${top.length?top.map(x=>`<div style="display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--line)"><span>${esc(x[0])}</span><b>${x[1]}</b></div>`).join(''):`<p class="muted">Ils apparaîtront ici au fil de ton journal.</p>`}</div><div class="card"><h3>Mon mode</h3><p class="muted">${esc(state.mode)}</p><button class="btn ghost wide" onclick="changeMode()">Changer</button></div>`}
function changeMode(){openSheet(`<h2>Comment veux-tu suivre ta progression ?</h2><button class="btn choice" onclick="setMode('Abstinence')"><b>Abstinence</b><br><span class="small muted">Suivre les périodes sans consommation / comportement.</span></button><button class="btn choice" onclick="setMode('Réduction de contrôle')"><b>Réduction / contrôle</b><br><span class="small muted">Observer la fréquence, l'intensité et les situations.</span></button><button class="btn choice" onclick="setMode('Reprise de contrôle')"><b>Reprise de contrôle</b><br><span class="small muted">Un suivi plus global, sans faire du compteur l'objectif.</span></button>`)}
function setMode(m){state.mode=m;save();closeSheet();render();toast('Mode mis à jour')}
function settings(){return `<section class="hero"><div class="eyebrow">PARAMÈTRES</div><h1>Tu contrôles tes données.</h1><p>V1 : Ascension fonctionne localement sur cet appareil.</p></section><div class="card"><h3>Mon espace</h3><label class="small">Nom affiché (facultatif)</label><input class="input" value="${esc(state.name)}" onchange="state.name=this.value;save()"><label class="small" style="display:block;margin-top:12px">Objectif</label><select class="input" onchange="state.goal=this.value;save()"><option value="">Je préfère ne pas préciser</option>${['Tabac','Alcool','Jeux d’argent','Alimentation','Réseaux sociaux','Jeux vidéo','Pornographie / sexualité','Achats compulsifs','Autre'].map(x=>`<option ${state.goal===x?'selected':''}>${x}</option>`).join('')}</select></div><div class="card"><h3>Personne de confiance</h3><p class="small muted">Un nom ou un numéro peut être enregistré sur cet appareil. Ascension ne contacte personne automatiquement.</p><input id="trusted" class="input" placeholder="Nom / téléphone" value="${esc(state.trusted)}"><button class="btn wide" style="margin-top:10px" onclick="saveTrusted()">Enregistrer</button></div><div class="card"><h3>Notifications</h3><p class="small muted">Pour cette V1, aucune notification n'est envoyée.</p></div><div class="card"><h3>Données</h3><p class="small muted">Les données du journal sont stockées dans le stockage local du navigateur. Effacer les données du site ou changer de navigateur/appareil peut les supprimer.</p><button class="btn danger wide" onclick="eraseAll()">Effacer toutes mes données</button></div><div class="card"><h3>À propos</h3><p class="small muted"><b>Ascension V1</b><br>Reprendre le contrôle. Avancer à son rythme.<br><br>Cette application est un prototype et ne remplace pas un accompagnement médical, psychologique ou addictologique.</p></div>`}
function saveTrusted(){state.trusted=document.getElementById('trusted').value.trim();save();toast('Personne de confiance enregistrée');render()}
function callTrusted(){if(/^\+?[0-9 .()-]{6,}$/.test(state.trusted)){location.href='tel:'+state.trusted.replace(/[^+0-9]/g,'')}else{toast('Ajoute un numéro dans Paramètres')}}
function nav(){return `<nav class="nav" style="grid-template-columns:repeat(5,1fr)"><button class="${screen==='home'?'active':''}" onclick="screen='home';render()"><span class="ico">⌂</span>Accueil</button><button class="${screen==='understand'?'active':''}" onclick="screen='understand';render()"><span class="ico">🧠</span>Comprendre</button><button class="${screen==='journal'?'active':''}" onclick="screen='journal';render()"><span class="ico">📖</span>Journal</button><button class="${screen==='progress'?'active':''}" onclick="screen='progress';render()"><span class="ico">↗</span>Progression</button><button class="${screen==='settings'?'active':''}" onclick="screen='settings';render()"><span class="ico">⚙</span>Réglages</button></nav>`}
function support(){openSheet(`<div class="eyebrow">MODE SOUTIEN</div><h2>Tu traverses une envie.</h2><p class="muted">Pas besoin de décider de tout maintenant. Commençons par comprendre ce qui se passe.</p><label class="small">Intensité de l\'envie</label><input id="sint" class="range" type="range" min="1" max="10" value="6" oninput="document.getElementById('sval').textContent=this.value"><div class="intensity"><span>1</span><strong id="sval">6</strong><span>10</span></div><div class="grid"><button class="btn" onclick="breath()">🫁 Respirer</button><button class="btn" onclick="pauseStep()">⏸️ Faire une pause</button><button class="btn" onclick="supportJournal()">✍️ Comprendre</button><button class="btn" onclick="trustedSupport()">👤 Appeler quelqu\'un</button></div><button class="btn ghost wide" style="margin-top:10px" onclick="recordUrge()">J'enregistre cette envie</button><p class="small muted" style="margin-top:14px">Si tu es en danger immédiat ou si quelqu\'un est en danger, contacte les services d'urgence ou une personne capable d'intervenir immédiatement.</p>`)}
function breath(){openSheet(`<div class="eyebrow">UNE PAUSE</div><h2>Respire avec moi.</h2><p class="muted">Inspire doucement. Expire plus longtemps. Tu n'as rien à réussir.</p><div class="card" style="text-align:center"><div style="font-size:64px">🫁</div><h3>4 secondes</h3><p class="muted">Inspire</p><h3>6 secondes</h3><p class="muted">Expire</p></div><button class="btn primary wide" onclick="support()">Retour au soutien</button>`)}
function pauseStep(){openSheet(`<div class="eyebrow">FAIRE UNE PAUSE</div><h2>Change quelque chose pendant quelques minutes.</h2><div class="list"><div class="item">🚶 Change de pièce ou sors prendre l'air.</div><div class="item">💧 Bois un verre d'eau.</div><div class="item">📱 Éloigne-toi du déclencheur si tu peux.</div><div class="item">👤 Contacte quelqu\'un.</div></div><button class="btn primary wide" onclick="support()">J'ai fait ma pause</button>`)}
function supportJournal(){openSheet(`<h2>Comprendre l\'envie</h2><p class="muted">Qu'est-ce qui s'est passé juste avant ?</p><div class="grid"><button class="btn" onclick="setSupportTrigger('Stress')">Stress</button><button class="btn" onclick="setSupportTrigger('Ennui')">Ennui</button><button class="btn" onclick="setSupportTrigger('Solitude')">Solitude</button><button class="btn" onclick="setSupportTrigger('Habitude')">Habitude</button><button class="btn" onclick="setSupportTrigger('Manque')">Manque</button><button class="btn" onclick="setSupportTrigger('Autre')">Autre</button></div>`)}
function setSupportTrigger(t){const i=Number(document.getElementById('sint')?.value||6);state.entries.push({date:new Date().toISOString(),type:'envie',intensity:i,trigger:t,note:'Envie enregistrée depuis le mode soutien.',help:''});save();closeSheet();screen='journal';render();toast('Tu viens de laisser une trace de ce moment')}
function recordUrge(){const i=Number(document.getElementById('sint')?.value||6);state.entries.push({date:new Date().toISOString(),type:'envie',intensity:i,trigger:'Non précisé',note:'Envie enregistrée depuis le mode soutien.',help:''});save();closeSheet();toast('Envie enregistrée. Le moment est passé dans ton histoire.')}
function trustedSupport(){closeSheet();if(state.trusted)callTrusted();else{screen='settings';render();toast('Ajoute d’abord une personne de confiance')}}
function openSheet(html){document.getElementById('supportModal').innerHTML=`<div class="sheet"><button class="btn ghost" style="float:right;padding:8px 11px" onclick="closeSheet()">✕</button>${html}<div style="clear:both"></div></div>`;document.getElementById('supportModal').classList.add('show')}
function closeSheet(){document.getElementById('supportModal').classList.remove('show')}
function eraseAll(){if(confirm('Effacer toutes les données locales d’Ascension ? Cette action est irréversible.')){localStorage.removeItem(KEY);location.reload()}}


if(typeof state.why!=="string")state.why="";
function setWhy(){openSheet("<h2>Mon pourquoi</h2><p class='muted'>Pourquoi veux-tu reprendre le contrôle ? Écris-le avec tes mots.</p><textarea id='whyInput' class='input textarea' placeholder='Pour ma santé, ma famille, ma liberté…'>"+esc(state.why)+"</textarea><button class='btn primary wide' onclick='saveWhy()'>Garder mon pourquoi</button>")}
function saveWhy(){state.why=document.getElementById("whyInput").value.trim();save();closeSheet();render();toast(state.why?"Ton pourquoi est là quand tu en as besoin.":"Tu pourras définir ton pourquoi plus tard.")}
function home(){const n=state.entries.filter(e=>e.type==="envie").length;return "<section class='hero'><div class='eyebrow'>"+greeting()+"</div><h1>"+(state.name?esc(state.name)+", tu n'es pas seul.":"Tu n'as pas besoin d'être parfait.")+"</h1><p>Tu n'as pas besoin de tout régler aujourd'hui. On peut simplement traverser le prochain moment ensemble.</p></section><button class='btn primary wide pulse' onclick='support()' style='font-size:18px;padding:19px'>🔥 J'ai besoin d'Ascension</button>"+(state.why?"<div class='card'><div class='eyebrow'>MON POURQUOI</div><h3>Quand c'est difficile, reviens ici.</h3><p style='font-size:18px;line-height:1.5'>« "+esc(state.why)+" »</p><p class='small muted'>Un rappel de ce qui compte pour toi. Pas une pression.</p></div>":"<div class='card'><h3>❤️ Pourquoi es-tu ici ?</h3><p class='muted'>Garde une phrase pour les moments où ce sera plus difficile.</p><button class='btn wide' onclick='setWhy()'>Définir mon pourquoi</button></div>")+"<div class='card'><div class='muted small'>AUJOURD'HUI</div><div style='display:flex;justify-content:space-between;align-items:end'><div><div class='big'>"+daysTracked()+"</div><div class='muted'>jour"+(daysTracked()>1?"s":"")+" suivi"+(daysTracked()>1?"s":"")+"</div></div><div style='text-align:right'><div class='big'>"+n+"</div><div class='muted'>envie"+(n>1?"s":"")+" traversée"+(n>1?"s":"")+"</div></div></div></div><div class='grid'><button class='btn' onclick='quickJournal()'>✍️ Journal</button><button class='btn' onclick=\"screen='progress';render()\">📈 Progression</button></div><div class='card'><h3>Mon cap</h3><p class='muted'>"+(state.goal?esc(state.goal):"Objectif non précisé")+"</p><p class='small'>"+esc(state.mode)+". Une rechute n'efface pas le chemin parcouru.</p></div>"+(state.trusted?"<div class='card'><h3>Ma personne de confiance</h3><p class='muted'>"+esc(state.trusted)+"</p><button class='btn wide' onclick='callTrusted()'>📞 Contacter</button></div>":"")}
function support(){openSheet("<div class='eyebrow'>JE SUIS LÀ</div><h2>Tu n'as pas besoin de lutter seul maintenant.</h2><p class='muted'>On ne va pas régler toute ta vie. On va simplement s'occuper de cette envie.</p>"+(state.why?"<div class='card'><div class='eyebrow'>TON POURQUOI</div><p style='font-size:18px;line-height:1.5'>« "+esc(state.why)+" »</p></div>":"")+"<label class='small'>À quel point l'envie est-elle forte ?</label><input id='sint' class='range' type='range' min='1' max='10' value='6' oninput=\"document.getElementById('sval').textContent=this.value\"><div class='intensity'><span>1</span><strong id='sval'>6</strong><span>10</span></div><p class='small muted'>Qu'est-ce qui l'a déclenchée ?</p><div class='grid'><button class='btn' onclick=\"supportChoose('Stress')\">Stress</button><button class='btn' onclick=\"supportChoose('Ennui')\">Ennui</button><button class='btn' onclick=\"supportChoose('Solitude')\">Solitude</button><button class='btn' onclick=\"supportChoose('Habitude')\">Habitude</button><button class='btn' onclick=\"supportChoose('Manque')\">Manque</button><button class='btn' onclick=\"supportChoose('Autre')\">Je ne sais pas</button></div><button class='btn ghost wide' style='margin-top:10px' onclick='recordUrge()'>Je veux juste l'enregistrer</button><p class='small muted'>Une envie n'est pas un ordre.</p>")}
function supportChoose(trigger){const i=Number(document.getElementById("sint")?.value||6);openSheet("<div class='eyebrow'>"+esc(trigger)+"</div><h2>Qu'est-ce qui pourrait t'aider maintenant ?</h2><p class='muted'>Choisis une seule chose. Il n'y a pas de bonne réponse.</p><div class='list'><button class='btn wide' onclick='breath()'>🫁 Respirer et faire une pause</button><button class='btn wide' onclick='pauseStep()'>🚶 Changer quelque chose autour de moi</button><button class='btn wide' onclick=\"supportNote('"+esc(trigger)+"',"+i+")\">✍️ Mettre des mots dessus</button><button class='btn wide' onclick='trustedSupport()'>👤 Contacter quelqu'un</button><button class='btn ghost wide' onclick=\"recordChosenUrge('"+esc(trigger)+"',"+i+")\">Je veux simplement traverser le moment</button></div>")}
function recordChosenUrge(trigger,intensity){state.entries.push({date:new Date().toISOString(),type:"envie",intensity:intensity,trigger:trigger,note:"Envie enregistrée depuis le mode soutien.",help:""});save();closeSheet();toast("Tu as pris le temps de traverser ce moment.");render()}
function supportNote(trigger,intensity){openSheet("<div class='eyebrow'>"+esc(trigger)+"</div><h2>Mettre des mots dessus</h2><p class='muted'>Qu'est-ce que tu veux garder de ce moment ?</p><textarea id='supportNote' class='input textarea' placeholder='Je ressens… / Je pense à… / J'ai besoin de…'></textarea><button class='btn primary wide' onclick=\"saveSupportNote('"+esc(trigger)+"',"+intensity+")\">Enregistrer et continuer</button>")}
function saveSupportNote(trigger,intensity){const note=document.getElementById("supportNote").value.trim();if(!note){toast("Écris quelques mots si tu en as envie");return}state.entries.push({date:new Date().toISOString(),type:"envie",intensity:intensity,trigger:trigger,note:note,help:"J'ai pris le temps de mettre des mots dessus."});save();closeSheet();toast("Ton moment est enregistré.");render()}

render();
</script>
</body>
